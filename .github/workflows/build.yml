name: Build AnarchyVoidDeath

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source
        run: |
          unzip -q AnarchyVoidDeath-source-fixed.zip -d source

      - name: Build plugin
        run: |
          mvn -B -f source/AnarchyVoidDeath/pom.xml clean package

      - uses: actions/upload-artifact@v4
        with:
          name: AnarchyVoidDeath-JAR
          path: source/AnarchyVoidDeath/target/*.jar
